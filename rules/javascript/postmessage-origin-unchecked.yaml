rules:
  - id: postmessage-handler-missing-origin-check
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This `message` handler reads `event.data` without ever looking at
      `event.origin`. Any page in any tab can open or reference this window and
      call `postMessage` on it, so without an origin comparison the handler treats
      a hostile document's payload as if it came from the application. Compare
      `event.origin` against an explicit allowlist of exact origins before touching
      `event.data`, and return early when it does not match. String operations such
      as `startsWith` or `indexOf` on the origin are not sufficient — an attacker
      registers `https://example.com.evil.net` and passes a prefix test.
    metadata:
      category: security
      cwe:
        - "CWE-346: Origin Validation Error"
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: HIGH
      subcategory:
        - vuln
      technology:
        - javascript
        - typescript
        - browser
      references:
        - https://cwe.mitre.org/data/definitions/346.html
        - https://developer.mozilla.org/en-US/docs/Web/API/Window/message_event
        - https://owasp.org/www-community/attacks/Cross_Site_Scripting_Flaw
    patterns:
      - pattern-either:
          - pattern: $W.addEventListener("message", $F, ...)
          - pattern: addEventListener("message", $F, ...)
          - pattern: $W.onmessage = $F
          - pattern: onmessage = $F
      # The handler shape, binding the event parameter so the origin check can
      # be looked for structurally. A `metavariable-regex` for `.origin` ran
      # over $F's raw source text, comments included, so
      # `// TODO: validate event.origin` suppressed the finding entirely.
      - metavariable-pattern:
          metavariable: $F
          patterns:
            - pattern-either:
                - pattern: ($E, ...) => { ... }
                - pattern: async ($E, ...) => { ... }
                - pattern: function ($E, ...) { ... }
                - pattern: function $N($E, ...) { ... }
                - pattern: async function ($E, ...) { ... }
                - pattern: async function $N($E, ...) { ... }
            # An `if` on the event's origin -- the early-return guard, in any
            # of its spellings -- is what a real check looks like. A check
            # written some other way (a boolean assigned first, a helper
            # called) is not recognised and the handler is still reported;
            # that direction is a false positive a reader can dismiss, not a
            # missed handler.
            - pattern-not: ($E, ...) => { ... if (<... $E.origin ...>) { ... } ... }
            - pattern-not: async ($E, ...) => { ... if (<... $E.origin ...>) { ... } ... }
            - pattern-not: function ($E, ...) { ... if (<... $E.origin ...>) { ... } ... }
            - pattern-not: function $N($E, ...) { ... if (<... $E.origin ...>) { ... } ... }
            - pattern-not: async function ($E, ...) { ... if (<... $E.origin ...>) { ... } ... }
            - pattern-not: async function $N($E, ...) { ... if (<... $E.origin ...>) { ... } ... }
      # Reads the event's data, either as a member access or by destructuring.
      # The old regex required a literal `.data`, so
      # `const { data } = event; render(data.html)` was missed.
      - metavariable-regex:
          metavariable: $F
          regex: (?s)^.*(?:\.data|\{[^}]*\bdata\b[^}]*\}\s*=).*$

  - id: postmessage-wildcard-target-origin
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      `postMessage` with a `"*"` target origin delivers the payload to whatever
      document currently occupies the target window, which the receiver controls by
      navigating itself. Because the payload here is a computed value rather than a
      constant, it may carry a session token, a one-time code or user data, and
      that data leaks to the attacker's origin. Pass the exact expected origin as
      the second argument so the browser drops the message when the target has
      navigated elsewhere.
    metadata:
      category: security
      cwe:
        - "CWE-1385: Missing Origin Validation in WebSockets and postMessage"
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: MEDIUM
      subcategory:
        - vuln
      technology:
        - javascript
        - typescript
        - browser
      references:
        - https://cwe.mitre.org/data/definitions/1385.html
        - https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage#security_concerns
    patterns:
      - pattern-either:
          - pattern: $W.postMessage($DATA, "*", ...)
          - pattern: postMessage($DATA, "*", ...)
      # Exclude a literal payload structurally rather than by its first
      # character. The old regex rejected anything *starting with* a quote or
      # a backtick, which is what `'token=' + sessionToken` and
      # `` `${sessionToken}` `` start with -- the two most common computed
      # forms, and the archetype of what this rule's own message describes.
      #
      # `"..."` matches a string literal and a template literal with no
      # substitution, and does not match one with `${}`, so these two
      # exclusions keep every genuinely constant payload out and let every
      # interpolated or concatenated one through. The remaining regex excludes
      # numeric and keyword constants, which are not strings.
      - pattern-not: $W.postMessage("...", "*", ...)
      - pattern-not: postMessage("...", "*", ...)
      - metavariable-regex:
          metavariable: $DATA
          regex: '^(?!(?:[0-9][0-9A-Za-z_.]*|true|false|null|undefined)$)'
