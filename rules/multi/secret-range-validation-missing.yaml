rules:
  - id: secret-share-range-validation-missing
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This share-combining routine checks that the x-coordinates are distinct but
      never checks that they are in range. In Shamir's scheme the secret is f(0),
      so x = 0 is not a share at all — it is the secret — and every correct
      `split()` or `evaluate()` refuses to issue it. A `combine()` that accepts it
      is inconsistent with the generator it is paired with: it will interpolate
      over a point the scheme's security argument assumes cannot exist, so a caller
      who supplies a crafted (0, y) pair controls the reconstructed output directly
      and the distinctness check does nothing to stop it. Validate each coordinate
      against the same bounds `split()` enforces — reject x = 0 and anything
      outside the field — and reject out-of-range values before interpolating, not
      only duplicate ones.
    metadata:
      category: security
      cwe:
        - "CWE-20: Improper Input Validation"
      confidence: LOW
      impact: HIGH
      likelihood: LOW
      subcategory:
        - audit
      technology:
        - javascript
        - typescript
        - crypto
        - secret-sharing
      references:
        - https://cwe.mitre.org/data/definitions/20.html
        - https://en.wikipedia.org/wiki/Shamir%27s_secret_sharing
        - https://datatracker.ietf.org/doc/html/draft-mcgrew-tss-03
      note: >-
        Heuristic and name-driven: it fires only inside a function whose name
        identifies it as a combine/reconstruct routine, and it reads any zero or
        range comparison anywhere in that function as validation. It is meant for
        auditing a secret-sharing implementation, not for a general scan.
    patterns:
      # A distinctness / duplicate check over the supplied shares. One anchor per
      # idiom, so a single routine yields a single finding.
      - pattern-either:
          - pattern: new Set(...)
          - pattern: $A.includes($X)
          - pattern: $A.indexOf($X)
      # Scoped to function declarations, which is the shape secret-sharing
      # libraries use for their public API. Arrow-assigned and class-method
      # implementations are out of scope rather than half-covered, so that a
      # correct implementation in one of those shapes is never reported.
      - pattern-inside:
          patterns:
            - pattern: |
                function $F(...) { ... }
            - metavariable-regex:
                metavariable: $F
                regex: (?i)^.*(combine|reconstruct|recover|interpolate|lagrange|fromshares|joinshares|unsplit).*$
      # Any comparison of a coordinate against 0 or 1 anywhere in the same
      # function is read as a range check and suppresses the finding. Semgrep's
      # `...` does not descend through a closure boundary, so the predicate forms
      # below are spelled out rather than left to deep matching.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                # Range check written as a direct guard.
                - pattern: "function $F(...) { ... if (<... $X === $Z ...>) { ... } ... }"
                - pattern: "function $F(...) { ... if (<... $X !== $Z ...>) { ... } ... }"
                - pattern: "function $F(...) { ... if (<... $X < $Z ...>) { ... } ... }"
                - pattern: "function $F(...) { ... if (<... $X > $Z ...>) { ... } ... }"
                - pattern: "function $F(...) { ... if (<... $X <= $Z ...>) { ... } ... }"
                - pattern: "function $F(...) { ... if (<... $X >= $Z ...>) { ... } ... }"
                # Range check written as a computed flag.
                - pattern: "function $F(...) { ... var $V = <... $X === $Z ...>; ... }"
                - pattern: "function $F(...) { ... var $V = <... $X !== $Z ...>; ... }"
                - pattern: "function $F(...) { ... var $V = <... $X < $Z ...>; ... }"
                - pattern: "function $F(...) { ... var $V = <... $X > $Z ...>; ... }"
                - pattern: "function $F(...) { ... var $V = <... $X <= $Z ...>; ... }"
                - pattern: "function $F(...) { ... var $V = <... $X >= $Z ...>; ... }"
                # Range check written as a predicate over shares.
                - pattern: "function $F(...) { ... var $V = $A.$M((...) => <... $X === $Z ...>); ... }"
                - pattern: "function $F(...) { ... var $V = $A.$M((...) => <... $X !== $Z ...>); ... }"
                - pattern: "function $F(...) { ... var $V = $A.$M((...) => <... $X < $Z ...>); ... }"
                - pattern: "function $F(...) { ... var $V = $A.$M((...) => <... $X > $Z ...>); ... }"
                - pattern: "function $F(...) { ... var $V = $A.$M((...) => <... $X <= $Z ...>); ... }"
                - pattern: "function $F(...) { ... var $V = $A.$M((...) => <... $X >= $Z ...>); ... }"
                # Range check written as a predicate used inline.
                - pattern: "function $F(...) { ... if ($A.$M((...) => <... $X === $Z ...>)) { ... } ... }"
                - pattern: "function $F(...) { ... if ($A.$M((...) => <... $X !== $Z ...>)) { ... } ... }"
                - pattern: "function $F(...) { ... if ($A.$M((...) => <... $X < $Z ...>)) { ... } ... }"
                - pattern: "function $F(...) { ... if ($A.$M((...) => <... $X > $Z ...>)) { ... } ... }"
                - pattern: "function $F(...) { ... if ($A.$M((...) => <... $X <= $Z ...>)) { ... } ... }"
                - pattern: "function $F(...) { ... if ($A.$M((...) => <... $X >= $Z ...>)) { ... } ... }"
            - metavariable-regex:
                metavariable: $Z
                regex: ^(?:0|1|0n|1n)$
